[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bii"
version = "0.1.0"
description = "Bayesian information imbalance: metric weights from triplet comparisons"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrea Mascaretti", email = "amascare@sissa.it" }]
dependencies = [
    "jax>=0.4,<1.0",
    "jaxlib>=0.4,<1.0",
    "blackjax>=1.0",
    "optax>=0.2",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "PLE"]
lint.ignore = ["S101", "N802", "N803", "N806"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/bii"]
